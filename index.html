<title>Treino de portugues</title>
<meta name="description" content="Práctica de portugués brasileño. Proyecto personal de estudio, no oficial, hecho a partir de las clases en el Instituto Guimarães Rosa.">
<meta name="theme-color" content="#F6F5F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Treino">

<style>
  /* =================== the palette ===================
     Every colour in the app is declared in this block and nowhere else. No
     rule further down names a colour, and the JavaScript names none at all.
     It sits up here in the <head> so the page has its background before
     anything else has loaded.

     Adding an assunto? Add one line to the .t- list and you are done. The
     tile, the swatch dot on its category card, the lesson row and the
     question card all read --hue off the element they are on, so there is no
     second list anywhere to keep in step. npm test fails if you miss one.

     Two copies live outside CSS because the platform gives us no choice: the
     theme-color meta above, and background_color/theme_color in
     manifest.webmanifest. A test holds all three to --ground. */
  :root{
    /* brighter than the old photocopy grey, still warm paper rather than white */
    --ground:#F6F5F1;
    --groundGlass:rgba(246,245,241,.95);  /* the sticky bars, under their blur */
    --card:#FFFFFF;
    --ink:#171A16;
    --onInk:#FBFBF9;                      /* type sitting on a dark button */
    --muted:#71756B;

    /* the ink, thinned: rules, tracks, washes, and the shadow under a button */
    --line:rgba(23,26,22,.13);
    --line2:rgba(23,26,22,.24);
    --wash:rgba(23,26,22,.05);            /* behind a block of code */
    --press:rgba(23,26,22,.07);           /* a flat button, held down */
    --track:rgba(23,26,22,.10);           /* the unfilled part of a progress bar */
    --sink:rgba(0,0,0,.42);               /* the 4px that makes a button pressable */
    --mutedSoft:rgba(113,117,107,.08);    /* a feedback box with no verdict */

    /* the pen colours, lifted. Amber is the highlighter: it carries the
       brightness without breaking the student-worksheet idea. */
    --green:#2E7D5B;  --greenSoft:#E7F4EC;
    --red:#C8453A;    --redSoft:#FCEBE9;
    --amber:#E3A22A;  --amberSoft:#FCF2DD;
    --blue:#2F5BA8;   --blueSoft:#EAF0FB;

    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --r:14px;         /* the app's corner radius */
    --pad:16px;
  }

  html{background:var(--ground)}
  body{margin:0;background:var(--ground)}

  /* ---------- one hue per assunto ----------
     Muted on purpose: fourteen saturated colours on one screen is a toy. These
     sit at roughly the same lightness so no single tile jumps out, and each is
     used three ways - a soft tint behind the tile, a firmer border, and the
     progress bar itself.

     Order matters: the fallback line has to come first, or it would win over
     the rules below it and paint everything grey. */
  .tile,.row,.qwrap,.cat{--hue:var(--muted)}
  .t-interrog   {--hue:#3D5A99}
  .t-gostar     {--hue:#B8433A}
  .t-estarcom   {--hue:#1F7A6B}
  .t-serestar   {--hue:#8A4372}
  .t-artigos    {--hue:#B58318}
  .t-prep       {--hue:#5B4A9E}
  .t-paises     {--hue:#6B7A2E}
  .t-fonetica   {--hue:#C06239}
  .t-antonimos  {--hue:#3F6675}
  .t-nosagente  {--hue:#45774A}
  .t-possessivos{--hue:#7D4E86}
  .t-expressoes {--hue:#2E7D8F}
  .t-alfabeto   {--hue:#8A6A1F}
  .t-numeros    {--hue:#9E3F66}
  .t-presente   {--hue:#4F7A2E}
  .t-preterito  {--hue:#35619B}
  .t-continuo   {--hue:#6B4F9E}
  .t-futuroim   {--hue:#9A7B22}
  .t-plurais    {--hue:#A14F3C}
  .t-diminutivos{--hue:#2E7A5C}
  .t-indefinidos{--hue:#A04A80}
  .t-horas      {--hue:#A8761F}
  .t-familia    {--hue:#6E57A3}
  .t-roupas     {--hue:#46833F}
  .t-rotina     {--hue:#B5543C}

  /* The four fixed categories, each borrowing the hue of a topic it holds. A
     topic with no .t- line of its own inherits its category's colour here
     rather than going grey - the cascade gives us that fallback for free. */
  .c-verbos     {--hue:#B8433A}
  .c-palavras   {--hue:#3D5A99}
  .c-som        {--hue:#C06239}
  .c-vocab      {--hue:#6B7A2E}
  .c-outros     {--hue:var(--muted)}
</style>
</head>
<body>
<script src="js/progress.js"></script>
<script>
/* Chromium fires this before the app boots, and Brave suppresses its own
   install banner entirely - so catch it here or the one-tap install is gone. */
window.__installEvent = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  window.__installEvent = e;
  window.dispatchEvent(new Event("portu-installable"));
});
window.addEventListener("appinstalled", function(){
  window.__installEvent = null;
  window.dispatchEvent(new Event("portu-installed"));
});
</script>
<div id="app"></div>

<style>
  /* the palette lives in the <head>, above - nothing down here names a colour */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* full bleed. The old bordered card read as a page inside something else. */
  #app{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--ground);
    min-height:100vh;
    min-height:100dvh;
    line-height:1.45;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) 40px}

  /* ---------- the bar that stays put ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--groundGlass);
    backdrop-filter:saturate(1.6) blur(10px);
    -webkit-backdrop-filter:saturate(1.6) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar .in{
    max-width:560px;margin:0 auto;
    padding:10px var(--pad);
    display:flex;align-items:center;gap:12px;
    min-height:54px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .brand img{width:26px;height:26px;border-radius:7px;flex:none;display:block}
  .brand span{
    font-family:var(--serif);font-size:17px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chip{
    flex:none;font-size:13px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* round bar: leave, progress, counter */
  .x{
    flex:none;width:34px;height:34px;
    border:none;background:transparent;color:var(--muted);
    font-size:22px;line-height:1;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
  }
  .x:active{background:var(--press)}
  .prog{
    flex:1;height:9px;border-radius:999px;
    background:var(--track);
    overflow:hidden;
  }
  .prog span{
    display:block;height:100%;border-radius:999px;
    background:var(--amber);
    transition:width .35s cubic-bezier(.2,.8,.2,1);
  }
  .count{
    flex:none;font-size:13px;color:var(--muted);
    font-variant-numeric:tabular-nums;min-width:38px;text-align:right;
  }

  /* ---------- surfaces ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:18px var(--pad);
    margin-top:14px;
  }
  .card.flush{padding:0;overflow:hidden}

  h1{
    font-family:var(--serif);
    font-size:25px;line-height:1.15;margin:0 0 5px;
    font-weight:400;letter-spacing:-.015em;
  }
  h2.sec{
    font-family:var(--serif);
    font-size:15px;font-weight:400;color:var(--muted);
    margin:28px 0 10px;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  h2.sec .n{font-family:var(--sans);font-size:12.5px;font-variant-numeric:tabular-nums}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}

  /* ---------- the hero, first thing you can touch ---------- */
  .hero{padding:26px 0 4px}
  .hero h1{font-size:28px;margin:0 0 6px}
  .hero .meta{font-size:13.5px;color:var(--muted);margin:0 0 20px}
  .hero .meta b{font-weight:600;color:var(--ink)}

  /* ---------- buttons you can feel ---------- */
  button{font-family:inherit;font-size:15px;cursor:pointer}
  .cta{
    width:100%;
    padding:15px 16px;
    background:var(--ink);
    color:var(--onInk);
    border:none;
    border-bottom:4px solid var(--sink);
    border-radius:12px;
    font-size:16px;font-weight:600;letter-spacing:.01em;
    transition:transform .06s, border-width .06s, filter .12s;
  }
  .cta:active{transform:translateY(2px);border-bottom-width:2px}
  .cta.ghost{
    background:var(--card);color:var(--ink);
    border:1.5px solid var(--line2);border-bottom-width:4px;
    font-weight:500;
  }
  .cta + .cta{margin-top:10px}
  .mark + .cta, .tail + .cta{margin-top:16px}

  .opt{
    display:block;width:100%;text-align:left;
    background:var(--card);
    border:1.5px solid var(--line2);
    border-bottom-width:4px;
    border-radius:12px;
    padding:15px 16px;
    min-height:54px;
    font-family:var(--serif);
    font-size:19px;
    color:var(--ink);
    transition:transform .06s, border-width .06s, border-color .12s, background .12s;
  }
  .opt:active:not([disabled]){transform:translateY(2px);border-bottom-width:2px}
  .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .opt.right{border-color:var(--green);background:var(--greenSoft)}
  .opt.wrong{border-color:var(--red);background:var(--redSoft);color:var(--red)}
  .opt[disabled]{cursor:default}
  .opt[disabled]:not(.right):not(.wrong){opacity:.5}
  .choices{display:flex;flex-direction:column;gap:10px}

  /* ---------- the question ---------- */
  .qwrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:20px var(--pad) 22px;
    margin-top:16px;
  }
  .qwrap .topic{
    font-size:11.5px;font-weight:600;letter-spacing:.05em;
    color:var(--hue);margin:0 0 9px;
  }
  .q{
    font-family:var(--serif);
    font-size:23px;line-height:1.5;margin:0 0 7px;
  }
  .blank{
    display:inline-block;min-width:62px;
    border-bottom:2px solid var(--amber);
    vertical-align:baseline;
  }
  .gloss{color:var(--muted);font-size:14px;font-style:italic;margin:0}

  input.write{
    width:100%;
    font-family:var(--serif);font-size:20px;
    padding:14px 15px;
    border:1.5px solid var(--line2);border-radius:12px;
    background:var(--card);color:var(--ink);
  }
  input.write:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}

  /* ---------- feedback ---------- */
  .mark{
    font-family:var(--serif);font-size:15.5px;line-height:1.5;
    margin:14px 0 0;padding:14px 15px;
    border-radius:12px;
    background:var(--mutedSoft);
  }
  .mark.hint{background:var(--blueSoft)}
  .mark.ok{background:var(--greenSoft)}
  .mark.no{background:var(--redSoft)}
  .mark b{font-weight:400;border-bottom:1.5px solid currentColor}
  .mark .lead{
    display:block;font-family:var(--sans);
    font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:5px;
  }
  .mark.ok .lead{color:var(--green)}
  .mark.no .lead{color:var(--red)}
  .mark.hint .lead{color:var(--blue)}

  /* ---------- topics as a grid, not a wall of rows ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tile{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 12px 11px;
    text-align:left;
    display:flex;flex-direction:column;gap:7px;
    min-height:76px;
    color:var(--ink);
    transition:transform .06s;
  }
  .tile:active{transform:translateY(1px)}
  .tile .nm{font-size:13.5px;line-height:1.3;flex:1;font-weight:500}
  .tile .bot{display:flex;align-items:center;gap:7px}
  .tile .bar{flex:1;height:5px;border-radius:999px;background:var(--track);overflow:hidden}
  .tile .bar span{display:block;height:100%;border-radius:999px;background:var(--hue)}
  .tile .nm{color:var(--ink)}
  .tile .key{
    display:block;width:9px;height:9px;border-radius:3px;
    background:var(--hue);margin-bottom:2px;
  }
  .tile{position:relative}
  .tile .pin{
    position:absolute;top:10px;right:10px;
    width:7px;height:7px;border-radius:50%;background:var(--red);
  }
  .tile .pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- lessons ---------- */
  .rows{display:flex;flex-direction:column}
  .row{
    display:flex;align-items:center;gap:11px;
    width:100%;text-align:left;
    background:var(--card);border:none;
    border-bottom:1px solid var(--line);
    padding:14px var(--pad);
    color:var(--ink);font-size:15px;
  }
  .row:last-child{border-bottom:none}
  .row:active{background:var(--blueSoft)}
  .row .nm{flex:1}
  .row .go{color:var(--muted);font-size:17px;flex:none}
  .row .dot{
    flex:none;width:6px;height:6px;border-radius:50%;
    background:var(--red);
  }
  .row .key{
    flex:none;width:9px;height:9px;border-radius:3px;
    background:var(--hue);
  }
  .row .tag{
    flex:none;font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- round summary ---------- */
  .score{
    font-family:var(--serif);font-size:58px;line-height:1;
    margin:4px 0 2px;letter-spacing:-.02em;
  }
  .score em{font-style:normal;color:var(--muted);font-size:28px}
  .misses{margin:16px 0 0;padding:0;list-style:none}
  .misses li{
    font-family:var(--serif);font-size:16px;
    padding:11px 0;border-top:1px solid var(--line);
  }
  .misses s{color:var(--red);text-decoration-color:var(--red)}
  .misses b{font-weight:400;color:var(--green)}
  .ok2{
    font-family:var(--sans);font-size:11px;font-weight:600;
    color:var(--green);background:var(--greenSoft);
    border-radius:999px;padding:2px 8px;
  }

  /* ---------- lesson screen ---------- */
  .hook{font-family:var(--serif);font-size:19px;line-height:1.5;margin:2px 0 14px}
  .pairs{width:100%;border-collapse:collapse;margin:4px 0}
  .pairs td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:15.5px}
  .pairs .es{width:44%;padding-right:12px;color:var(--muted);font-style:italic}
  .pairs .pt{font-family:var(--serif);font-size:17px}

  /* ---------- odds and ends ---------- */
  .tail{font-size:12.5px;color:var(--muted);margin:10px 0 0}
  .foot{
    margin-top:22px;font-size:12.5px;
    display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  }
  .link{background:none;border:none;color:var(--muted);font-size:12.5px;padding:6px 0;text-decoration:underline}
  input.file{display:block;width:100%;font-family:var(--sans);font-size:13px;color:var(--muted);padding:10px 0 2px}
  textarea.pack{
    width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.5;padding:12px;
    border:1.5px solid var(--line2);border-radius:12px;
    background:var(--card);color:var(--ink);resize:vertical;
  }
  textarea.pack:focus{outline:none;border-color:var(--blue)}
  .shape{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.55;white-space:pre;overflow-x:auto;
    background:var(--wash);border-radius:10px;
    padding:12px;margin:10px 0 0;
  }
  .inst{
    margin-top:16px;padding:16px var(--pad);
    border:1.5px dashed var(--line2);border-radius:var(--r);
    background:var(--card);
  }
  .inst h2{font-family:var(--serif);font-size:17px;font-weight:400;margin:0 0 4px}
  .inst p{color:var(--muted);font-size:13px;margin:0 0 12px}
  .inst ol{margin:0;padding-left:19px;font-size:13.5px;line-height:1.65}
  .inst li{margin-bottom:4px}
  .inst .note{font-size:12px;font-style:italic;margin:10px 0 0}
  .inst .no{display:block;margin:12px 0 0;text-align:right}

  /* ---------- the tab bar ---------- */
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--groundGlass);
    backdrop-filter:saturate(1.6) blur(12px);
    -webkit-backdrop-filter:saturate(1.6) blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs .in{max-width:560px;margin:0 auto;display:flex}
  .tabs button{
    flex:1;background:none;border:none;
    padding:9px 4px 9px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:11px;letter-spacing:.01em;
    transition:color .12s;
  }
  .tabs button.on{color:var(--ink);font-weight:600}
  .tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabs .badge{
    position:absolute;transform:translate(13px,-4px);
    min-width:16px;height:16px;border-radius:999px;
    background:var(--red);color:var(--card);
    font-size:10px;font-weight:700;line-height:16px;text-align:center;
    padding:0 4px;
  }
  /* room for the bar, so the last row is never hidden behind it */
  .wrap{padding-bottom:86px}

  /* ---------- category cards ---------- */
  .cat{
    display:flex;align-items:center;gap:13px;
    width:100%;text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-bottom-width:3px;
    border-radius:12px;
    padding:15px var(--pad);
    margin-bottom:9px;
    color:var(--ink);
    transition:transform .06s, border-width .06s;
  }
  .cat:active{transform:translateY(1px);border-bottom-width:2px}
  .cat .swatch{
    flex:none;display:grid;grid-template-columns:1fr 1fr;gap:2px;
    width:22px;height:22px;
  }
  .cat .swatch i{display:block;border-radius:2px;background:var(--hue)}
  .cat .swatch i.empty{background:transparent}
  .cat .txt{flex:1;min-width:0}
  .cat .nm{font-size:16px;font-weight:600;display:block}
  .cat .meta{font-size:12.5px;color:var(--muted)}
  .cat .go{color:var(--muted);font-size:18px;flex:none}

  /* ---------- motion: what makes it feel like an app ---------- */
  @media (prefers-reduced-motion:no-preference){
    .screen{animation:slide .26s cubic-bezier(.2,.8,.2,1)}
    .stamp{animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
    .shake{animation:shake .32s}
  }
  @keyframes slide{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)}
    30%,70%{transform:translateX(4px)}
    50%{transform:translateX(-4px)}
  }
  @keyframes pulse{50%{filter:brightness(1.22)}}
</style>

<script>
(function(){
"use strict";

/* ---------------- item bank ---------------- */
/* t=topic k=kind(mc|w) q=sentence g=Spanish gloss c=choices a=answer
   alt=accepted variants h=Socratic hint e=explanation w=weak-tags        */

var TOPICS = [
  {id:"interrog", name:"Pronomes interrogativos"},
  {id:"gostar",   name:"Verbo gostar"},
  {id:"estarcom", name:"Estar com"},
  {id:"serestar", name:"Ser e estar"},
  {id:"artigos",  name:"Artigos, contrações, crase"},
  {id:"prep",     name:"Preposições"},
  {id:"paises",   name:"Gênero dos países"},
  {id:"fonetica", name:"Sistema consonântico"},
  {id:"antonimos",name:"Antônimos"},
  {id:"nosagente", name:"Nós e a gente"},
  {id:"possessivos", name:"Pronomes possessivos"},
  {id:"expressoes", name:"Expressões de sala de aula"},
  {id:"alfabeto", name:"O alfabeto"},
  {id:"numeros", name:"Os números"},
  {id:"presente", name:"Presente do indicativo"},
  {id:"preterito", name:"Pretérito perfeito"},
  {id:"continuo", name:"Presente contínuo"},
  {id:"futuroim", name:"Futuro imediato"},
  {id:"plurais", name:"O plural"},
  {id:"diminutivos", name:"O diminutivo"},
  {id:"indefinidos", name:"Pronomes indefinidos"},
  {id:"horas", name:"Que horas são"},
  {id:"familia", name:"A família"},
  {id:"roupas", name:"Roupas e acessórios"},
  {id:"rotina", name:"Rotina diária"}
];

/* The slips seen in the notebook, plus escala — which is not a slip but the
   six items about how far up the scale you are, so the lesson that teaches

{id:"antonimos-122",t:"antonimos",k:"mc",q:"O antônimo de calmo é:",g:"calmo = tranquilo",c:["nervoso","manso","vazio","barato"],a:"nervoso",h:"La escala aquí es el carácter. ¿Cuál es el otro extremo?",e:"calmo / nervoso (tranquilo / nervioso).",w:[]},

{id:"antonimos-128",t:"antonimos",k:"mc",q:"O antônimo de paz é:",g:"paz = paz",c:["guerra","injustiça","mentira","briga"],a:"guerra",h:"La escala es la relación entre países. ¿Cuál es el otro extremo?",e:"paz / guerra.",w:[]},

{id:"nosagente-1",t:"nosagente",k:"mc",q:"A gente ___ à praia depois do almoço.",g:"Nosotros vamos a la playa después del almuerzo.",c:["vai","vamos","vão","íamos"],a:"vai",h:"A gente significa nós, pero ¿lleva el verbo en la forma de nós, o en la de ele/ela?",e:"A gente vai. La expresión siempre lleva la forma de ele/ela, aunque signifique nós.",w:[]},
{id:"nosagente-2",t:"nosagente",k:"mc",q:"Nós ___ à praia depois do almoço.",g:"Nosotros vamos a la playa después del almuerzo.",c:["vamos","vai","vão","ia"],a:"vamos",h:"Nós pide la primera persona del plural. ¿Cuál de las formas es esa?",e:"Nós vamos. Con nós, el verbo va en la 1ª persona del plural.",w:[]},

{id:"nosagente-5",t:"nosagente",k:"mc",q:"Aquele rapaz é um ___ de trânsito.",g:"Aquel muchacho es un agente de tránsito.",c:["agente","a gente","há gente","pessoal"],a:"agente",h:"Um ___ de trânsito: ¿es un oficio que ejerce una persona, o somos nosotros?",e:"Agente de trânsito. Un cargo, un sustantivo.",w:[]},

{id:"nosagente-9",t:"nosagente",k:"mc",q:"Oba, nosso ___ de viagens conseguiu passagens mais baratas.",g:"¡Qué bien! Nuestro agente de viajes consiguió pasajes más baratos.",c:["agente","a gente","há gente","pessoal"],a:"agente",h:"Después de nosso tiene que venir un sustantivo. ¿Cuál de los tres lo es?",e:"Nosso agente de viagens. Solo el sustantivo agente acepta nosso delante.",w:[]},
{id:"nosagente-10",t:"nosagente",k:"mc",q:"___ que não valoriza o trabalho dos outros.",g:"Hay gente que no valora el trabajo de los demás.",c:["Há gente","A gente","Agente","As gente"],a:"Há gente",h:"¿Existe esa gente, o somos nosotros?",e:"Há gente que... = hay gente que...",w:[]},
{id:"nosagente-11",t:"nosagente",k:"mc",q:"Aquele ___ é corrupto.",g:"Aquel agente es corrupto.",c:["agente","a gente","há gente","gente"],a:"agente",h:"Aquele pide un sustantivo masculino singular detrás. ¿Cuál de los tres lo es?",e:"Aquele agente. «Aquele a gente» no existe: a gente ya lleva el artículo a dentro.",w:[]},
{id:"nosagente-12",t:"nosagente",k:"mc",q:"A professora viu ___ fazendo bagunça durante a aula.",g:"La profesora nos vio haciendo desorden durante la clase.",c:["a gente","agente","há gente","nós"],a:"a gente",h:"¿A quiénes vio? Y como objeto del verbo, ¿se dice nós o a gente?",e:"Viu a gente = nos vio. Como objeto se usa a gente, no nós.",w:[]},
{id:"nosagente-13",t:"nosagente",k:"mc",q:"¿Cuál de estas frases está mal escrita?",g:"",c:["A gente demais nesse lugar.","Eles foram educados com a gente.","A gente gosta de dançar forró.","É bom ter pessoas com quem a gente possa contar."],a:"A gente demais nesse lugar.",h:"Una de ellas quiere decir «hay demasiada gente». ¿Cuál necesitaría el verbo haver en vez del pronombre?",e:"«A gente demais nesse lugar» se quedó sin verbo. Lo correcto es «Há gente demais nesse lugar».",w:[]},
{id:"nosagente-14",t:"nosagente",k:"mc",q:"¿Cuál de las dos sirve también para hablar formalmente?",g:"",c:["nós","a gente","las dos por igual","ninguna de las dos"],a:"nós",h:"El material marca una de las dos como propia solo del habla informal. ¿Cuál será?",e:"Nós sirve tanto para lo formal como para lo informal. A gente es solo informal.",w:[]},
{id:"nosagente-15",t:"nosagente",k:"w",q:"Escríbelo en portugués usando a gente: «Nosotros vamos a la playa.»",g:"",a:"a gente vai à praia",alt:["a gente vai à praia."],h:"Primero el verbo en la forma de ele/ela. Después ir + a + a praia: ¿qué sale de juntar esas dos aes?",e:"A gente vai à praia. Fíjate en la crase: a + a = à.",w:["contr"]},
{id:"posse-1",t:"possessivos",k:"mc",q:"Deixei ___ coisas junto com as minhas. (você)",g:"Dejé tus cosas junto con las mías.",c:["suas","seus","sua","seu"],a:"suas",h:"Coisas es femenino y plural. ¿El posesivo concuerda con el dueño, o con la cosa?",e:"El posesivo concuerda con la cosa poseída: coisas → suas. En español «sus» no cambia de género; en portugués sí cambia.",w:["posse"]},
{id:"posse-2",t:"possessivos",k:"mc",q:"Eu e meu colega já terminamos ___ atividades do dia.",g:"Mi colega y yo ya terminamos nuestras actividades del día.",c:["nossas","nossos","nossa","nosso"],a:"nossas",h:"Atividades es femenino plural. ¿Qué forma de nosso le corresponde?",e:"Atividades es femenino plural → nossas. El posesivo sigue al sustantivo, no a quien posee.",w:["posse"]},
{id:"posse-3",t:"possessivos",k:"mc",q:"Estou com dor em ___ costas.",g:"Me duele la espalda.",c:["minhas","minha","meu","meus"],a:"minhas",h:"En portugués costas va siempre en plural, aunque la espalda en español sea singular. ¿Y entonces el posesivo?",e:"As costas es plural en portugués → minhas costas. El singular «la espalda» del español es lo que hace resbalar.",w:["posse"]},
{id:"posse-4",t:"possessivos",k:"mc",q:"Não fale de ___ problemas com estranhos.",g:"No hables de tus problemas con extraños.",c:["seus","suas","seu","sua"],a:"seus",h:"Problemas acaba en -as, pero ¿es femenino de verdad?",e:"Problemas es masculino plural, a pesar de la terminación -as → seus problemas.",w:["posse"]},
{id:"posse-5",t:"possessivos",k:"mc",q:"Comprei um presente para ___ filho. (você)",g:"Compré un regalo para tu hijo.",c:["seu","seus","sua","suas"],a:"seu",h:"Filho es masculino singular. ¿Qué forma le toca?",e:"Filho es masculino singular → seu filho.",w:["posse"]},
{id:"posse-6",t:"possessivos",k:"mc",q:"Essas são ___ coisas. (eu)",g:"Esas son mis cosas.",c:["minhas","meus","minha","meu"],a:"minhas",h:"Coisas es femenino plural. ¿Y meu en femenino plural?",e:"Minhas coisas. Meu, minha, meus, minhas — siempre según la cosa poseída.",w:["posse"]},
{id:"posse-7",t:"possessivos",k:"mc",q:"___ família se reúne todos os anos. (eu)",g:"Mi familia se reúne todos los años.",c:["Minha","Meu","Minhas","Meus"],a:"Minha",h:"Família es femenino singular. ¿Qué forma de meu le corresponde?",e:"Minha família.",w:["posse"]},
{id:"posse-8",t:"possessivos",k:"mc",q:"___ antepassados emigraram para cá. (nós)",g:"Nuestros antepasados emigraron para acá.",c:["Nossos","Nossas","Nosso","Nossa"],a:"Nossos",h:"Antepassados es masculino plural. ¿Y nosso en masculino plural?",e:"Nossos antepassados.",w:["posse"]},
{id:"posse-9",t:"possessivos",k:"mc",q:"___ horários estão acertados para trabalharem juntos? (vocês)",g:"¿Sus horarios están acordados para trabajar juntos?",c:["Seus","Suas","Seu","Sua"],a:"Seus",h:"Horários es masculino plural. ¿Qué forma le corresponde?",e:"Seus horários. También se dice «os horários de vocês».",w:["posse"]},
{id:"posse-10",t:"possessivos",k:"mc",q:"A lancha ___ é linda. (do Mário)",g:"La lancha de él es linda.",c:["dele","dela","deles","delas"],a:"dele",h:"Mário es un hombre, y es uno solo. ¿Qué sale de de + ele?",e:"de + ele = dele. A lancha dele.",w:[]},
{id:"posse-11",t:"possessivos",k:"mc",q:"O carro ___ é moderno. (da Juliana)",g:"El carro de ella es moderno.",c:["dela","dele","delas","deles"],a:"dela",h:"Juliana es una mujer, y es una sola. ¿Qué sale de de + ela?",e:"de + ela = dela.",w:[]},
{id:"posse-12",t:"possessivos",k:"mc",q:"A casa ___ é enorme. (dos meninos)",g:"La casa de ellos es enorme.",c:["deles","dele","delas","dela"],a:"deles",h:"Meninos son varios y masculinos. ¿Qué contracción sale?",e:"de + eles = deles.",w:[]},
{id:"posse-13",t:"possessivos",k:"mc",q:"O trabalho ___ é bom. (das professoras)",g:"El trabajo de ellas es bueno.",c:["delas","deles","dela","dele"],a:"delas",h:"Professoras son varias y femeninas. ¿Qué contracción sale?",e:"de + elas = delas.",w:[]},
{id:"posse-14",t:"possessivos",k:"mc",q:"João já falou com o supervisor ___. (o supervisor do João)",g:"João ya habló con su supervisor. (el de João)",c:["dele","seu","dela","deles"],a:"dele",h:"«Seu supervisor» podría ser el de João o el de la persona con quien hablas. ¿Qué palabra lo deja claro?",e:"O supervisor dele = o do João, sin ambigüedad. Es la forma que el brasileño prefiere.",w:["posse"]},
{id:"posse-15",t:"possessivos",k:"mc",q:"Depois da briga com o marido, ela fez ___ e as colocou na sala.",g:"Después de la pelea con el marido, hizo sus maletas y las puso en la sala.",c:["as malas dela","suas malas","as malas dele","malas suas"],a:"as malas dela",h:"«Suas malas» no dice si son de ella o de él. ¿Cuál de las opciones lo deja claro?",e:"As malas dela. Con «suas» no se sabe de quién son as malas.",w:["posse"]},
{id:"posse-16",t:"possessivos",k:"mc",q:"¿Por qué los brasileños prefieren dele y dela a seu y sua?",g:"",c:["Porque seu e sua podem ser de você, dele, dela, deles ou delas","Porque seu e sua estão errados","Porque dele e dela são mais formais","Porque seu e sua não existem no Brasil"],a:"Porque seu e sua podem ser de você, dele, dela, deles ou delas",h:"Piensa en «A professora disse que a sua resposta estava errada». ¿De quién era la respuesta?",e:"Seu y sua sirven para muchas personas a la vez, así que generan ambigüedad. Dele, dela, deles y delas dejan claro de quién es.",w:[]},
{id:"posse-17",t:"possessivos",k:"w",q:"Escríbelo en portugués: «Esas son mis cosas.»",g:"",a:"essas são minhas coisas",alt:["essas são as minhas coisas"],h:"Coisas es femenino plural. ¿Qué forma tiene que tomar el posesivo entonces?",e:"Essas são minhas coisas.",w:["posse"]},
{id:"exp-1",t:"expressoes",k:"mc",q:"No Brasil, «Pois não!» quer dizer:",g:"",c:["Claro, pode falar","Não, de jeito nenhum","Talvez","Não entendi"],a:"Claro, pode falar",h:"Parece una negación, pero es justo lo contrario. ¿Qué te contesta un mesero cuando lo llamas?",e:"Pois não! = claro, dígame. Es la trampa más grande de la lista para quien habla español: parece «pues no», pero es un sí.",w:[]},
{id:"exp-2",t:"expressoes",k:"mc",q:"Você precisa passar entre duas pessoas. Você diz:",g:"",c:["Com licença","Desculpe","De nada","Pois não"],a:"Com licença",h:"El español usa perdón para pedir paso y también para disculparse. El portugués separa las dos. ¿Cuál es la de pedir paso?",e:"Com licença pide paso o permiso. Desculpe es para disculparse de algo que ya hiciste.",w:[]},
{id:"exp-3",t:"expressoes",k:"mc",q:"Você chegou atrasado à aula. Você diz:",g:"",c:["Desculpe o atraso","Com licença o atraso","Pois não","De nada"],a:"Desculpe o atraso",h:"Ya llegaste tarde: ¿estás pidiendo paso, o estás pidiendo disculpas?",e:"Desculpe o atraso. Com licença serviría para entrar, no para disculparse.",w:[]},
{id:"exp-4",t:"expressoes",k:"mc",q:"Uma mulher agradece. Ela diz:",g:"",c:["Obrigada","Obrigado","Obrigades","Obrigados"],a:"Obrigada",h:"En español gracias no cambia nunca. En portugués la palabra concuerda con quien habla. ¿Y si habla una mujer?",e:"Obrigada cuando quien habla es mujer. Concuerda con quien agradece, no con quien recibe.",w:[]},
{id:"exp-5",t:"expressoes",k:"mc",q:"Um homem agradece. Ele diz:",g:"",c:["Obrigado","Obrigada","Obrigados","Obrigadas"],a:"Obrigado",h:"La misma regla, al revés. ¿Quién está hablando?",e:"Obrigado, porque quien habla es hombre.",w:[]},
{id:"exp-6",t:"expressoes",k:"mc",q:"Alguém agradece a você. Você responde:",g:"",c:["De nada","Por favor","Com licença","Desculpe"],a:"De nada",h:"¿Cuál de las cuatro es el equivalente de «de nada»?",e:"De nada, por nada, o não há de quê.",w:[]},
{id:"exp-7",t:"expressoes",k:"mc",q:"___ é o seu nome?",g:"¿Cuál es tu nombre?",c:["Qual","Que","O que","Como"],a:"Qual",h:"El español dice cuál aquí. ¿Coincide el portugués?",e:"Qual é o seu nome? Igual que en español.",w:["que-oque"]},
{id:"exp-8",t:"expressoes",k:"mc",q:"___ você se chama?",g:"¿Cómo te llamas?",c:["Como","Qual","O que","Quem"],a:"Como",h:"Aquí no se pregunta cuál, sino de qué manera. ¿Qué palabra es esa?",e:"Como você se chama? — Eu me chamo...",w:[]},
{id:"exp-9",t:"expressoes",k:"mc",q:"___ anos você tem?",g:"¿Cuántos años tienes?",c:["Quantos","Quanto","Quantas","Qual"],a:"Quantos",h:"Anos es masculino plural, y quanto va pegado a él. ¿Concuerda, entonces?",e:"Quantos anos você tem? — Eu tenho...",w:[]},
{id:"exp-10",t:"expressoes",k:"mc",q:"El lunes, en portugués:",g:"",c:["segunda-feira","primeira-feira","lunes-feira","luna-feira"],a:"segunda-feira",h:"La semana portuguesa se cuenta desde el domingo. ¿Qué número le toca al lunes?",e:"Domingo, segunda, terça, quarta, quinta, sexta, sábado. Solo domingo y sábado tienen nombre propio.",w:[]},
{id:"exp-11",t:"expressoes",k:"mc",q:"El miércoles, en portugués:",g:"",c:["quarta-feira","terça-feira","quinta-feira","quatro-feira"],a:"quarta-feira",h:"Cuenta desde el domingo: domingo, segunda, terça… ¿y el miércoles?",e:"Miércoles = quarta-feira, el cuarto día contando desde el domingo.",w:[]},
{id:"exp-12",t:"expressoes",k:"mc",q:"El viernes, en portugués:",g:"",c:["sexta-feira","sétima-feira","seis-feira","quinta-feira"],a:"sexta-feira",h:"Contando desde el domingo, ¿qué número de día es el viernes?",e:"Sexta-feira. Fíjate en que sexta viene de seis, no de sete.",w:[]},
{id:"exp-13",t:"expressoes",k:"mc",q:"Hoje é quarta. ___ foi segunda.",g:"Hoy es miércoles. Anteayer fue lunes.",c:["Anteontem","Ontem","Amanhã","Depois de amanhã"],a:"Anteontem",h:"Del miércoles al lunes hay dos días hacia atrás. ¿Qué palabra dice eso?",e:"Anteontem, ontem, hoje, amanhã, depois de amanhã.",w:[]},
{id:"exp-14",t:"expressoes",k:"mc",q:"Hoje é segunda. ___ será quarta.",g:"Hoy es lunes. Pasado mañana será miércoles.",c:["Depois de amanhã","Amanhã","Ontem","Anteontem"],a:"Depois de amanhã",h:"Dos días hacia adelante. ¿Cuál de las opciones lo dice con tres palabras?",e:"Depois de amanhã = pasado mañana.",w:[]},
{id:"exp-15",t:"expressoes",k:"mc",q:"Você não entendeu o que a professora disse. Você pede:",g:"",c:["Poderia repetir, por favor?","Pois não?","De nada.","Com licença."],a:"Poderia repetir, por favor?",h:"¿Cuál de las cuatro pide que lo digan otra vez?",e:"Poderia repetir, por favor? También: Pode falar mais devagar, por favor?",w:[]},
{id:"exp-16",t:"expressoes",k:"mc",q:"Você quer saber uma palavra em português. Você pergunta:",g:"",c:["Como se diz «tomate» em português?","Que é tomate em português?","Qual tomate em português?","Onde é tomate em português?"],a:"Como se diz «tomate» em português?",h:"La fórmula arranca igual que en español: «¿Cómo se dice…?»",e:"Como se diz, fala, escreve, soletra ou pronuncia ... em português?",w:[]},
{id:"exp-17",t:"expressoes",k:"w",q:"Escríbelo en portugués: «Buenos días, ¿todo bien?»",g:"",a:"bom dia tudo bem",h:"Buenos días va en singular en portugués. ¿Y cómo se dice ahí «todo bien»?",e:"Bom dia, tudo bem?",w:[]},
{id:"alf-1",t:"alfabeto",k:"mc",q:"O alfabeto português completo tem quantas letras?",g:"",c:["26","23","27","25"],a:"26",h:"Incluye K, W e Y, como el alfabeto latino completo. ¿Cuántas da eso?",e:"26 letras, em maiúscula ou minúscula.",w:[]},
{id:"alf-2",t:"alfabeto",k:"mc",q:"Como se lê a letra H?",g:"",c:["agá","ache","hache","agé"],a:"agá",h:"En español es «hache». ¿Cómo la acorta el portugués?",e:"H = agá.",w:[]},
{id:"alf-3",t:"alfabeto",k:"mc",q:"Como se lê a letra W?",g:"",c:["dáblio","doble-vê","uvê-duplo","vê-duplo"],a:"dáblio",h:"El portugués la tomó prestada del inglés «double-u». ¿Cómo suena eso dicho en portugués?",e:"W = dáblio.",w:[]},
{id:"alf-4",t:"alfabeto",k:"mc",q:"Como se lê a letra Y?",g:"",c:["ípsilon","i-grego","iê","ipsilone"],a:"ípsilon",h:"El español dice «i griega». ¿Qué nombre usa el portugués?",e:"Y = ípsilon.",w:[]},
{id:"alf-5",t:"alfabeto",k:"mc",q:"Como se lê a letra X?",g:"",c:["xis","equis","cs","chis"],a:"xis",h:"En español es «equis». ¿Cuál es la versión corta portuguesa?",e:"X = xis.",w:[]},
{id:"alf-6",t:"alfabeto",k:"mc",q:"Como se lê a letra K?",g:"",c:["cá","ka","kappa","quê"],a:"cá",h:"En español es «ka». ¿Con qué letra la escribe el portugués?",e:"K = cá.",w:[]},
{id:"alf-7",t:"alfabeto",k:"mc",q:"Você quer que alguém diga as letras de uma palavra, uma por uma. Você pergunta:",g:"",c:["Como se soletra?","Como se pronuncia?","Como se fala?","Qual é a letra?"],a:"Como se soletra?",h:"Deletrear, en español. ¿Cuál de los verbos portugueses es ese?",e:"Soletrar = deletrear. Como se soletra o seu nome?",w:[]},
{id:"alf-8",t:"alfabeto",k:"mc",q:"O til (~) serve para:",g:"",c:["nasalizar a vogal","marcar a sílaba forte","abrir a vogal","separar sílabas"],a:"nasalizar a vogal",h:"En mãe y pão, ¿la marca te dice dónde va la fuerza, o cómo sale la vocal?",e:"El til nasaliza: mãe, pão, irmãs. No marca la fuerza, al contrario que la tilde española.",w:[]},
{id:"alf-9",t:"alfabeto",k:"mc",q:"O acento grave, como em às duas horas, marca:",g:"",c:["a crase","a sílaba forte","uma vogal nasal","uma vogal fechada"],a:"a crase",h:"Esa à sale de juntar dos palabras. ¿Cómo se llama esa fusión?",e:"El acento grave solo marca la crase, la fusión de a con a: a + as = às.",w:["contr"]},
{id:"alf-10",t:"alfabeto",k:"mc",q:"A cedilha (ç) só aparece antes de:",g:"",c:["a, o, u","e, i","todas as vogais","consoantes"],a:"a, o, u",h:"Delante de e o de i, la c ya suena como s por sí sola. ¿Hace falta la cedilla ahí?",e:"Ç solo antes de a, o, u: criança, açúcar, franês no la lleva.",w:[]},
{id:"alf-11",t:"alfabeto",k:"mc",q:"O trema (ü) no português do Brasil:",g:"",c:["já não se usa","usa-se em linguiça","usa-se antes de e","usa-se nos nomes"],a:"já não se usa",h:"¿Lo has visto en algo escrito después de 2009?",e:"El trema desapareció con la reforma de 2009: cinquenta y linguiça ya no lo llevan.",w:[]},
{id:"alf-12",t:"alfabeto",k:"w",q:"Escríbelo en portugués: el nombre de la letra H",g:"",a:"agá",h:"¿Cómo dirías esa letra al deletrear tu nombre en portugués?",e:"H = agá. Es la que más se aparta del español.",w:[]},
{id:"num-1",t:"numeros",k:"mc",q:"Tenho ___ irmãs.",g:"Tengo dos hermanas.",c:["duas","dois","dúas","doas"],a:"duas",h:"En español dos no cambia nunca. En portugués sí. Irmãs es femenino: ¿qué forma toca?",e:"Duas irmãs. Dois y duas concuerdan en género — es la diferencia que el español no entrena.",w:[]},
{id:"num-2",t:"numeros",k:"mc",q:"Tenho ___ irmãos.",g:"Tengo dos hermanos.",c:["dois","duas","dos","doises"],a:"dois",h:"Irmãos es masculino. ¿Y la forma masculina del 2?",e:"Dois irmãos.",w:[]},
{id:"num-3",t:"numeros",k:"mc",q:"Comprei ___ camisa.",g:"Compré una camisa.",c:["uma","um","umas","uns"],a:"uma",h:"Camisa es femenino singular. ¿Qué forma del 1 le corresponde?",e:"Uma camisa. Um y uma concuerdan, igual que en español.",w:[]},
{id:"num-4",t:"numeros",k:"mc",q:"O número 500 escreve-se:",g:"",c:["quinhentos","cincocentos","cinquentos","quintentos"],a:"quinhentos",h:"¿Sale de cinco + cientos como en español, o es una forma propia?",e:"500 = quinhentos. Es el más irregular de la serie de las centenas.",w:[]},
{id:"num-5",t:"numeros",k:"mc",q:"___ pessoas vieram à festa.",g:"Doscientas personas vinieron a la fiesta.",c:["Duzentas","Duzentos","Dozentas","Duascentas"],a:"Duzentas",h:"Pessoas es femenino. ¿Concuerdan también las centenas en portugués?",e:"Duzentas pessoas. Duzentos/duzentas, trezentos/trezentas, todas concuerdan.",w:[]},
{id:"num-6",t:"numeros",k:"mc",q:"O aluguel custa ___ reais.",g:"El alquiler cuesta doscientos reales.",c:["duzentos","duzentas","dozentos","doiscentos"],a:"duzentos",h:"Reais es masculino. ¿Y la forma masculina de 200?",e:"Duzentos reais.",w:[]},
{id:"num-7",t:"numeros",k:"mc",q:"O número 123 lê-se:",g:"",c:["cento e vinte e três","cento vinte e três","cem e vinte e três","cento vinte três"],a:"cento e vinte e três",h:"El portugués mete una e entre cada parte; el español no. ¿Cuántas hacen falta aquí?",e:"Cento e vinte e três. El e es obligatorio entre las partes.",w:[]},
{id:"num-8",t:"numeros",k:"mc",q:"O número 100, sozinho, lê-se:",g:"",c:["cem","cento","cens","centos"],a:"cem",h:"¿Cuál de las dos se usa cuando va solo, como cien y ciento en español?",e:"100 sozinho = cem. Con algo más se vuelve cento e..., como cento e um.",w:[]},
{id:"num-9",t:"numeros",k:"mc",q:"O número 16 escreve-se:",g:"",c:["dezesseis","dezaseis","dizesseis","dez e seis"],a:"dezesseis",h:"Se arma con dez + e + seis, todo pegado. ¿Qué vocal queda en medio?",e:"16 = dezesseis. También dezessete, dezoito, dezenove.",w:[]},
{id:"num-10",t:"numeros",k:"mc",q:"Ao ditar um telefone no Brasil, o número 6 costuma ser dito como:",g:"",c:["meia","seis","sêis","meio"],a:"meia",h:"Viene de meia dúzia. ¿Qué palabra se usa para que seis no se confunda con três?",e:"Meia = seis, de meia dúzia. Muy común al dictar números.",w:[]},
{id:"num-11",t:"numeros",k:"mc",q:"O número 40 escreve-se:",g:"",c:["quarenta","cuarenta","quarrenta","quaranta"],a:"quarenta",h:"¿Empieza con qu, o con cu como en español?",e:"40 = quarenta.",w:[]},
{id:"num-12",t:"numeros",k:"mc",q:"O número 1000 escreve-se:",g:"",c:["mil","um mil","mill","mils"],a:"mil",h:"Igual que en español. ¿Lleva algo delante, o va sola?",e:"1000 = mil. Se dice mil, nunca «um mil».",w:[]},
{id:"num-13",t:"numeros",k:"w",q:"Escríbelo en portugués: «Tengo dos hijas.»",g:"",a:"tenho duas filhas",h:"Filhas es femenino. ¿Qué le pasa al 2 en portugués?",e:"Tenho duas filhas.",w:[]},
{id:"num-14",t:"numeros",k:"mc",q:"O número 7 escreve-se:",g:"",c:["sete","siete","séte","sette"],a:"sete",h:"En español siete lleva diptongo. ¿Qué le pasa a ese diptongo al cruzar al portugués?",e:"7 = sete. El diptongo del español se deshace: siete, sete; nueve, nove; diez, dez.",w:[]},
{id:"num-15",t:"numeros",k:"mc",q:"O número 14 escreve-se:",g:"",c:["catorze","catorce","quatorce","cuatorze"],a:"catorze",h:"Suena casi igual que en español. ¿Qué letra cambia al final?",e:"14 = catorze. Del 11 al 15 hay que aprendérselos: onze, doze, treze, catorze, quinze.",w:[]},
{id:"num-16",t:"numeros",k:"mc",q:"O número 17 escreve-se:",g:"",c:["dezessete","dezasete","dezsete","dez e sete"],a:"dezessete",h:"Se arma con dez más sete, todo pegado. ¿Cuántas eses quedan en medio?",e:"17 = dezessete. Del 16 al 19: dezesseis, dezessete, dezoito, dezenove.",w:[]},
{id:"num-17",t:"numeros",k:"mc",q:"O número 50 escreve-se:",g:"",c:["cinquenta","cincuenta","cinqüenta","cinquienta"],a:"cinquenta",h:"¿Va con qu como quatro, o con cu como en español?",e:"50 = cinquenta, con qu. Igual que quarenta.",w:[]},
{id:"num-18",t:"numeros",k:"mc",q:"O número 60 escreve-se:",g:"",c:["sessenta","sesenta","secenta","seissenta"],a:"sessenta",h:"¿Lleva una s en medio como en español, o dos?",e:"60 = sessenta, con doble s.",w:[]},
{id:"num-19",t:"numeros",k:"mc",q:"O número 32 lê-se:",g:"",c:["trinta e dois","trinta dois","treinta e dois","trinta e doze"],a:"trinta e dois",h:"El portugués une la decena y la unidad con algo que el español no pone. ¿Con qué?",e:"32 = trinta e dois. De 21 en adelante siempre va una e entre las partes.",w:[]},
{id:"num-20",t:"numeros",k:"w",q:"Escríbelo en portugués: el número 15",g:"",a:"quinze",h:"Está entre catorze y dezesseis. ¿Cómo se escribe?",e:"15 = quinze.",w:[]},
{id:"num-21",t:"numeros",k:"mc",q:"O ordinal de 3 é:",g:"",c:["terceiro","tercero","treceiro","terço"],a:"terceiro",h:"¿Cómo dirías el tercer piso en portugués: o ___ andar?",e:"3º = terceiro. Concuerda como un adjetivo: o terceiro andar, a terceira vez.",w:[]},
{id:"num-22",t:"numeros",k:"mc",q:"O ordinal de 9 é:",g:"",c:["nono","noveno","novo","nonavo"],a:"nono",h:"En español es noveno. ¿El portugués lo alarga o lo acorta?",e:"9º = nono, nunca noveno.",w:[]},
{id:"num-23",t:"numeros",k:"mc",q:"Os dias da semana vêm dos ordinais. A terça-feira corresponde a:",g:"",c:["terceiro","segundo","quarto","primeiro"],a:"terceiro",h:"Si la semana empieza en domingo, ¿qué lugar ocupa el martes?",e:"Terça-feira es el martes, el tercer día: sale de terceiro, aunque se diga terça.",w:[]},
{id:"pres-0",t:"presente",k:"mc",q:"Eu ___ português todos os dias.",g:"Yo hablo portugués todos los días.",c:["falo","fala","falas","falamos"],a:"falo",h:"¿Qué terminación le toca a eu en los verbos en -ar?",e:"Eu falo. La casilla de eu termina en -o en las tres conjugaciones.",w:[]},
{id:"pres-1",t:"presente",k:"mc",q:"Você ___ muito rápido.",g:"Tú hablas muy rápido.",c:["fala","falas","falo","falam"],a:"fala",h:"El español pone una -s en hablas. ¿De qué persona es você por dentro?",e:"Você es tercera persona: fala, igual que ele y ela. Falas no existe en esta clase.",w:["voce-2p"]},
{id:"pres-2",t:"presente",k:"mc",q:"Nós ___ às nove.",g:"Nosotros abrimos a las nueve.",c:["abrimos","abremos","abrem","abro"],a:"abrimos",h:"Abrir es de la tercera conjugación. ¿Nós lleva -emos o -imos?",e:"Los verbos en -ir hacen -imos: nós abrimos. Los en -er hacen -emos: nós comemos.",w:[]},
{id:"pres-3",t:"presente",k:"mc",q:"Vocês ___ cedo.",g:"Ustedes comen temprano.",c:["comem","comam","come","comeis"],a:"comem",h:"¿Cuál es la casilla de vocês en los verbos en -er?",e:"Vocês comem. En -er y en -ir el plural termina en -em.",w:[]},
{id:"pres-4",t:"presente",k:"mc",q:"Ele ___ a loja às oito.",g:"Él abre la tienda a las ocho.",c:["abre","abri","abra","abrem"],a:"abre",h:"¿Qué terminación llevan ele y ela en los verbos en -ir?",e:"Ele abre. En -er y en -ir la tercera persona del singular termina en -e.",w:[]},
{id:"pres-5",t:"presente",k:"mc",q:"Eles ___ muito dinheiro.",g:"Ellos tienen mucho dinero.",c:["têm","tem","teem","tenho"],a:"têm",h:"El sujeto es plural. ¿Qué distingue por escrito la forma de uno de la de varios?",e:"Ele tem, eles têm. El acento circunflejo es lo único que los separa.",w:[]},
{id:"pres-6",t:"presente",k:"mc",q:"Eu ___ tudo em seu lugar.",g:"Yo pongo todo en su lugar.",c:["ponho","pono","põe","pomos"],a:"ponho",h:"Pôr es irregular. ¿Oyes una n en la casilla de eu?",e:"Eu ponho. Después: você põe, nós pomos, eles põem.",w:[]},
{id:"pres-7",t:"presente",k:"mc",q:"Você ___ certeza do que está fazendo?",g:"¿Tienes la certeza de lo que estás haciendo?",c:["tem","têm","tens","tenho"],a:"tem",h:"¿Você va con la forma de uno o con la de varios?",e:"Você tem, sin -s y sin acento. Tens pertenece a un tú que esta clase no usa.",w:["voce-2p"]},
{id:"pres-8",t:"presente",k:"mc",q:"Felipe ___ aulas de francês.",g:"Felipe da clases de francés.",c:["dá","da","dou","dão"],a:"dá",h:"Una de las dos lleva acento. ¿Cuál de ellas es el verbo?",e:"Dá con acento es el verbo dar. Da sin acento es de + a.",w:[]},
{id:"pres-9",t:"presente",k:"mc",q:"Maria nunca ___ a verdade.",g:"María nunca dice la verdad.",c:["diz","dize","digo","dizem"],a:"diz",h:"¿Cómo queda dizer en la tercera persona del singular?",e:"Eu digo, você diz, nós dizemos, eles dizem.",w:[]},
{id:"pres-10",t:"presente",k:"mc",q:"Nós ___ alemão agora.",g:"Nosotros estudiamos alemán ahora.",c:["estudamos","estudemos","estudam","estudo"],a:"estudamos",h:"¿Qué casilla de nós piden los verbos en -ar?",e:"Nós estudamos. Esa misma forma vale para el pasado, así que agora es lo que la fija en el presente.",w:[]},
{id:"pres-11",t:"presente",k:"w",q:"Escríbelo en portugués: “Yo veo bien.”",g:"",a:"eu vejo bem",alt:["vejo bem"],h:"¿Le aparece alguna letra nueva a ver en la casilla de eu?",e:"Eu vejo bem. Después: você vê, nós vemos, eles veem.",w:[]},
{id:"pres-12",t:"presente",k:"w",q:"Escríbelo en portugués: “Ustedes pueden hacer el trabajo.”",g:"",a:"vocês podem fazer o trabalho",alt:["podem fazer o trabalho"],h:"¿Cuál es la casilla de vocês en poder?",e:"Vocês podem fazer o trabalho.",w:[]},
{id:"pret-0",t:"preterito",k:"mc",q:"Eu ___ esta blusa na semana passada.",g:"Compré esta blusa la semana pasada.",c:["comprei","comprou","comprava","compro"],a:"comprei",h:"¿Qué terminación lleva eu en el pasado de los verbos en -ar?",e:"Eu comprei. En -ar el pasado va -ei, -ou, -amos, -aram.",w:[]},
{id:"pret-1",t:"preterito",k:"mc",q:"Eles ___ por você durante duas horas.",g:"Ellos te esperaron dos horas.",c:["esperaram","esperam","esperavam","esperou"],a:"esperaram",h:"El sujeto es plural y la acción ya acabó. ¿Qué terminación junta las dos cosas?",e:"Eles esperaram. El plural del pasado en -ar es -aram; -am sin r sería el presente.",w:[]},
{id:"pret-2",t:"preterito",k:"mc",q:"Você ___ um cachorro-quente?",g:"¿Pediste un perro caliente?",c:["pediu","pediste","pedia","pedi"],a:"pediu",h:"Pedir es de la tercera conjugación. ¿Qué lleva você en el pasado?",e:"Você pediu. En -ir el pasado va -i, -iu, -imos, -iram.",w:["voce-2p"]},
{id:"pret-3",t:"preterito",k:"mc",q:"Eu ___ uma comida muito gostosa.",g:"Hice una comida muy rica.",c:["fiz","fez","fazia","fazi"],a:"fiz",h:"Fazer cambia de radical en el pasado. ¿Qué forma corta le queda a eu?",e:"Eu fiz, você fez, nós fizemos, eles fizeram.",w:["pret-irreg"]},
{id:"pret-4",t:"preterito",k:"mc",q:"A Rainha da Inglaterra ___ no Brasil em 1968.",g:"La Reina de Inglaterra estuvo en Brasil en 1968.",c:["esteve","estive","estava","estou"],a:"esteve",h:"El sujeto es ella, no yo. ¿Cuál de las dos formas parecidas le toca?",e:"Eu estive, ela esteve. Se parecen mucho y se cambian una por otra sin darse cuenta.",w:["pret-irreg"]},
{id:"pret-5",t:"preterito",k:"mc",q:"Eles me ___ tudo que aconteceu.",g:"Ellos me dijeron todo lo que pasó.",c:["disseram","diziam","dizeram","disse"],a:"disseram",h:"¿Cuál es el radical de dizer en el pasado?",e:"Disse, disse, dissemos, disseram. El radical pasa a diss- con doble s.",w:["pret-irreg"]},
{id:"pret-6",t:"preterito",k:"mc",q:"Elas ___ todo o dinheiro no cofre.",g:"Ellas pusieron todo el dinero en la caja fuerte.",c:["puseram","punham","ponharam","pôs"],a:"puseram",h:"Pôr hace pus en la casilla de eu. ¿Cómo sigue en plural?",e:"Pus, pôs, pusemos, puseram.",w:["pret-irreg"]},
{id:"pret-7",t:"preterito",k:"mc",q:"No fim de semana passado nós ___ feijoada.",g:"El fin de semana pasado hicimos feijoada.",c:["fizemos","fazemos","faziamos","fizeram"],a:"fizemos",h:"¿El radical del pasado de fazer es faz- o fiz-?",e:"Nós fizemos. El radical es fiz- en todo el pasado menos en fez.",w:["pret-irreg"]},
{id:"pret-8",t:"preterito",k:"mc",q:"Anteontem eu ___ ao banco.",g:"Anteayer fui al banco.",c:["fui","foi","ia","vou"],a:"fui",h:"¿Qué forma de ir le toca a eu en el pasado?",e:"Eu fui, você foi, nós fomos, eles foram. Son las mismas de ser.",w:["pret-irreg"]},
{id:"pret-9",t:"preterito",k:"mc",q:"Elas ___ amigas de escola.",g:"Ellas fueron amigas de la escuela.",c:["foram","foi","eram","seram"],a:"foram",h:"Aquí el verbo es ser, no ir. ¿Cambia eso la forma?",e:"No cambia nada: ser e ir comparten fui, foi, fomos, foram.",w:["pret-irreg"]},
{id:"pret-10",t:"preterito",k:"mc",q:"Em qual destas frases fui é o verbo ir?",g:"",c:["Eu fui ao Recife.","Eu fui professor.","Eu fui o primeiro.","Eu fui simpático."],a:"Eu fui ao Recife.",h:"Las cuatro empiezan igual. ¿Cuál de ellas lleva un destino detrás?",e:"Fui es ser y es ir a la vez. Lo que sigue decide: un lugar pide ir, una cualidad pide ser.",w:["pret-irreg"]},
{id:"pret-11",t:"preterito",k:"mc",q:"Ontem nós ___ muitos sapatos.",g:"Ayer compramos muchos zapatos.",c:["compramos","comprávamos","compraram","compraremos"],a:"compramos",h:"¿Cambia la casilla de nós del presente al pasado en los verbos en -ar?",e:"No cambia: nós compramos vale para los dos. Ontem es lo único que lo pone en el pasado.",w:[]},
{id:"pret-12",t:"preterito",k:"w",q:"Escríbelo en portugués: “Yo supe la verdad por el periódico.”",g:"",a:"eu soube a verdade pelo jornal",alt:["soube a verdade pelo jornal"],h:"Saber cambia de radical en el pasado. ¿Qué forma toma con eu?",e:"Eu soube a verdade pelo jornal.",w:["pret-irreg"]},
{id:"pret-13",t:"preterito",k:"w",q:"Escríbelo en portugués: “Ellos trajeron todas las bebidas.”",g:"",a:"eles trouxeram todas as bebidas",alt:["trouxeram todas as bebidas"],h:"Trazer cambia de radical. ¿Con qué letra se escribe ese sonido?",e:"Eles trouxeram. Va con x: trouxe, trouxemos, trouxeram.",w:["pret-irreg"]},
{id:"cont-0",t:"continuo",k:"mc",q:"Agora a Ana ___ o ônibus na rodoviária.",g:"Ahora Ana está esperando el autobús en la terminal.",c:["está esperando","está a esperar","está esperado","estão esperando"],a:"está esperando",h:"¿Qué le quitas al infinitivo esperar, y qué le pegas después?",e:"Esperar sin la r más -ndo da esperando. En Brasil se dice está esperando, no está a esperar.",w:[]},
{id:"cont-1",t:"continuo",k:"mc",q:"Eu estou ___ uma nova música.",g:"Estoy componiendo una canción nueva.",c:["compondo","componendo","componiendo","compoendo"],a:"compondo",h:"Compor termina en -or. ¿Qué queda al quitarle la r?",e:"Compo más -ndo da compondo. Pôr hace lo mismo: pondo.",w:[]},
{id:"cont-2",t:"continuo",k:"mc",q:"Nós estamos ___ para casa, já é tarde.",g:"Vamos yendo a casa, ya es tarde.",c:["indo","iendo","vindo","ido"],a:"indo",h:"Ir es un infinitivo de dos letras. ¿Qué queda al quitarle la r?",e:"I más -ndo da indo. No lo confundas con vindo, que es el de vir.",w:[]},
{id:"cont-3",t:"continuo",k:"mc",q:"Os meninos estão ___ vitamina de abacate.",g:"Los niños están tomando un licuado de aguacate.",c:["bebendo","bebiendo","bebindo","bebido"],a:"bebendo",h:"Beber es de la segunda conjugación. ¿Lleva i el gerundio?",e:"Beber da bebendo. Los verbos en -er no llevan esa i; el español sí la pone.",w:["ger-endo"]},
{id:"cont-4",t:"continuo",k:"mc",q:"Agora nós estamos ___ a pizza que preparamos.",g:"Ahora estamos comiendo la pizza que preparamos.",c:["comendo","comiendo","comindo","comido"],a:"comendo",h:"El español dice comiendo. ¿Qué letra sobra al pasarlo?",e:"Comer da comendo, sin i.",w:["ger-endo"]},
{id:"cont-5",t:"continuo",k:"mc",q:"Os estrangeiros estão ___ na praia de Copacabana.",g:"Los extranjeros están nadando en la playa de Copacabana.",c:["nadando","nadendo","nadindo","nadado"],a:"nadando",h:"¿Qué vocal conserva el gerundio de un verbo en -ar?",e:"Nadar da nadando. Los verbos en -ar hacen -ando, igual que el español.",w:[]},
{id:"cont-6",t:"continuo",k:"mc",q:"Ela está ___ até tarde.",g:"Ella está durmiendo hasta tarde.",c:["dormindo","durmindo","dormiendo","dormendo"],a:"dormindo",h:"El español cambia la o por u en durmiendo. ¿El portugués mueve también esa vocal?",e:"Dormir da dormindo. El radical se queda igual, y la terminación de -ir es -indo.",w:["ger-endo"]},
{id:"cont-7",t:"continuo",k:"mc",q:"O que ela está ___?",g:"¿Qué está haciendo?",c:["fazendo","faziendo","fazindo","feito"],a:"fazendo",h:"Fazer es de la segunda conjugación. ¿Qué terminación le toca?",e:"Fazer da fazendo.",w:["ger-endo"]},
{id:"cont-8",t:"continuo",k:"mc",q:"Onde você está ___?",g:"¿Dónde estás viviendo?",c:["morando","morendo","morindo","morado"],a:"morando",h:"Morar es de la primera conjugación. ¿Con qué vocal sigue el gerundio?",e:"Morar da morando. Onde você está morando?",w:[]},
{id:"cont-9",t:"continuo",k:"mc",q:"Qual é o presente contínuo de partir, com ele?",g:"",c:["está partindo","está partendo","está partiendo","está partido"],a:"está partindo",h:"¿Los verbos en -ir hacen -endo o -indo?",e:"Partir da partindo. En -ir el gerundio conserva la i.",w:["ger-endo"]},
{id:"cont-10",t:"continuo",k:"w",q:"Escríbelo en portugués: “Ellas están conversando en la plaza.”",g:"",a:"elas estão conversando na praça",alt:["estão conversando na praça"],h:"¿Qué forma de estar le toca a elas, y cómo queda el gerundio?",e:"Elas estão conversando na praça. Estar concuerda y el gerundio no cambia.",w:[]},
{id:"fut-0",t:"futuroim",k:"mc",q:"Eu ___ almoçar ao meio-dia.",g:"Voy a almorzar al mediodía.",c:["vou","vou a","vai","vamos"],a:"vou",h:"El español mete una palabra entre voy y almorzar. ¿El portugués también?",e:"Eu vou almoçar, sin nada en medio.",w:["vou-a"]},
{id:"fut-1",t:"futuroim",k:"mc",q:"Ela ___ chegar a qualquer momento.",g:"Ella va a llegar en cualquier momento.",c:["vai","vai a","vou","vão"],a:"vai",h:"¿Qué forma de ir le toca a ela, y lleva algo detrás?",e:"Ela vai chegar. Nada entre vai y el infinitivo.",w:["vou-a"]},
{id:"fut-2",t:"futuroim",k:"mc",q:"Nós ___ viajar neste final de semana.",g:"Vamos a viajar este fin de semana.",c:["vamos","vamos a","vão","vai"],a:"vamos",h:"El español dice vamos a viajar. ¿Qué sobra al pasarlo?",e:"Nós vamos viajar.",w:["vou-a"]},
{id:"fut-3",t:"futuroim",k:"mc",q:"Eles ___ dançar esta noite.",g:"Ellos van a bailar esta noche.",c:["vão","vão a","vai","vamos"],a:"vão",h:"¿Cuál es la casilla de eles en el verbo ir?",e:"Eles vão dançar.",w:["vou-a"]},
{id:"fut-4",t:"futuroim",k:"mc",q:"Qual destas frases está correta?",g:"",c:["Eu vou à igreja.","Eu vou ir à igreja.","Eu vou de ir à igreja.","Eu vou a ir à igreja."],a:"Eu vou à igreja.",h:"Vou ya es el verbo ir. ¿Hace falta decirlo dos veces?",e:"Eu vou ir es una redundancia: vou ya es ir. Basta eu vou à igreja.",w:[]},
{id:"fut-5",t:"futuroim",k:"mc",q:"Você ___ o café da manhã agora?",g:"¿Vas a tomar el desayuno ahora?",c:["vai tomar","vai a tomar","vais tomar","vão tomar"],a:"vai tomar",h:"Dos cosas que resolver: la casilla de você, y si cabe algo entre los dos verbos.",e:"Você vai tomar. Sin -s y sin a.",w:["voce-2p","vou-a"]},
{id:"fut-6",t:"futuroim",k:"mc",q:"Meu filho ___ uma prova muito difícil.",g:"Mi hijo va a hacer un examen muy difícil.",c:["vai fazer","vai a fazer","vão fazer","vai fazendo"],a:"vai fazer",h:"¿Qué va justo después de vai: un infinitivo o un gerundio?",e:"Vai fazer. El futuro inmediato pide el infinitivo tal cual.",w:[]},
{id:"fut-7",t:"futuroim",k:"mc",q:"Minha mãe ___ feijoada para nós.",g:"Mi mamá va a cocinar feijoada para nosotros.",c:["vai cozinhar","vai a cozinhar","vai cozinhando","vão cozinhar"],a:"vai cozinhar",h:"¿El verbo principal se queda en infinitivo o cambia de forma?",e:"Vai cozinhar, el infinitivo sin tocarlo.",w:[]},
{id:"fut-8",t:"futuroim",k:"mc",q:"Meus netos ___ para as férias.",g:"Mis nietos van a venir para las vacaciones.",c:["vão vir","vão venir","vai vir","vão vindo"],a:"vão vir",h:"El sujeto es plural. ¿Y el segundo verbo se queda en infinitivo?",e:"Meus netos vão vir. Vir no se transforma.",w:[]},
{id:"fut-9",t:"futuroim",k:"mc",q:"Amanhã nós ___ para o Pantanal.",g:"Mañana vamos al Pantanal.",c:["vamos","vamos ir","vamos a","vão"],a:"vamos",h:"El destino ya está en la frase. ¿Hace falta repetir el verbo ir?",e:"Nós vamos para o Pantanal. Vamos ir sería decirlo dos veces.",w:[]},
{id:"fut-10",t:"futuroim",k:"w",q:"Escríbelo en portugués: “Yo voy a estudiar portugués en Brasil.”",g:"",a:"eu vou estudar português no brasil",alt:["vou estudar português no brasil"],h:"¿Qué palabra del español desaparece entre los dos verbos?",e:"Eu vou estudar português no Brasil.",w:["vou-a"]},
{id:"plur-0",t:"plurais",k:"mc",q:"O plural de homem é:",g:"el hombre / los hombres",c:["homens","homems","homenes","homeis"],a:"homens",h:"¿En qué letra termina homem? Esa letra es la que manda.",e:"En -m la m se cambia por -ns: homens, imagens, garagens.",w:[]},
{id:"plur-1",t:"plurais",k:"mc",q:"O plural de animal é:",g:"el animal / los animales",c:["animais","animales","animals","animaus"],a:"animais",h:"¿Dónde cae el acento en animal, al principio o al final?",e:"Acento al final, así que la l se vuelve -is: animais. El español conserva su l y el portugués la pierde.",w:[]},
{id:"plur-2",t:"plurais",k:"mc",q:"O plural de professor é:",g:"el profesor / los profesores",c:["professores","professors","professoros","professeres"],a:"professores",h:"¿Qué se le añade a una palabra terminada en -r?",e:"En -r se añade -es: professores, atores, cantores, sabores.",w:[]},
{id:"plur-3",t:"plurais",k:"mc",q:"O plural de rapaz é:",g:"el muchacho / los muchachos",c:["rapazes","rapaz","rapazs","rapaces"],a:"rapazes",h:"Termina en -z. ¿Se le añade -s o -es?",e:"En -z se añade -es: rapazes, narizes, raízes, gravidezes.",w:[]},
{id:"plur-4",t:"plurais",k:"mc",q:"O plural de pão é:",g:"el pan / los panes",c:["pães","pãos","pões","panes"],a:"pães",h:"El -ão tiene tres salidas. ¿Cuál le toca a esta, que es de las más usadas del idioma?",e:"Pão da pães, igual que alemão da alemães y capitão da capitães.",w:["plural-ao"]},
{id:"plur-5",t:"plurais",k:"mc",q:"O plural de avião é:",g:"el avión / los aviones",c:["aviões","aviães","aviãos","avions"],a:"aviões",h:"¿Cuál de las tres salidas del -ão cubre la mayoría de las palabras?",e:"Avião da aviões. La salida -ões es la más común con diferencia.",w:["plural-ao"]},
{id:"plur-6",t:"plurais",k:"mc",q:"O plural de irmão é:",g:"el hermano / los hermanos",c:["irmãos","irmães","irmões","irmanos"],a:"irmãos",h:"Esta es de las pocas que solo añaden una letra. ¿Cuál?",e:"Irmão da irmãos, como cidadão da cidadãos y grão da grãos.",w:["plural-ao"]},
{id:"plur-7",t:"plurais",k:"mc",q:"O plural de azul é:",g:"azul / azules",c:["azuis","azules","azuls","azúis"],a:"azuis",h:"Termina en -ul con el acento al final. ¿Qué le pasa a la l?",e:"Azul da azuis: la l se va y entra -is.",w:[]},
{id:"plur-8",t:"plurais",k:"mc",q:"O plural de ônibus é:",g:"el autobús / los autobuses",c:["ônibus","ônibuses","ônibuss","ónibus"],a:"ônibus",h:"El acento cae en la primera sílaba. ¿Cambia algo entonces?",e:"No cambia nada: um ônibus, dois ônibus. Igual lápis, pires, tênis y vírus.",w:[]},
{id:"plur-9",t:"plurais",k:"mc",q:"O plural de francês é:",g:"francés / franceses",c:["franceses","francêses","francesos","franceis"],a:"franceses",h:"El acento cae al final. ¿Sobrevive el acento escrito en el plural?",e:"Francês da franceses: se añade -es y el acento escrito desaparece.",w:[]},
{id:"plur-10",t:"plurais",k:"mc",q:"O plural de réptil é:",g:"el reptil / los reptiles",c:["répteis","réptis","reptiles","réptils"],a:"répteis",h:"En réptil el acento no cae en la última sílaba. ¿Eso cambia la regla del -l?",e:"Réptil da répteis. Cuando el -il no es tónico se cambia por -eis: férteis, têxteis.",w:[]},
{id:"plur-11",t:"plurais",k:"mc",q:"O plural de garçom é:",g:"el mesero / los meseros",c:["garçons","garçoms","garçones","garções"],a:"garçons",h:"Termina en -m. ¿Qué le pasa siempre a esa m?",e:"En -m entra -ns: garçons, homens, imagens.",w:[]},
{id:"plur-12",t:"plurais",k:"w",q:"Escríbelo en portugués: “los faroles azules”",g:"",a:"os faróis azuis",alt:["faróis azuis"],h:"Las dos palabras terminan en -l. ¿Les pasa lo mismo a las dos?",e:"Os faróis azuis. El adjetivo también concuerda y también pierde la l.",w:[]},
{id:"plur-14",t:"plurais",k:"mc",q:"O plural de cão é:",g:"el perro / los perros",c:["cães","cãos","cões","canes"],a:"cães",h:"Es del mismo grupo que pão. ¿Qué salida le toca entonces?",e:"Cão da cães, como pão da pães. Dois cães, nunca dois cãos.",w:["plural-ao"]},
{id:"plur-13",t:"plurais",k:"mc",q:"O plural de látex é:",g:"el látex",c:["látex","látexes","látexs","láteces"],a:"látex",h:"Termina en -x. ¿Cambian las palabras en -x?",e:"No cambian: látex, xérox, pirex, ônix, durex.",w:[]},
{id:"dim-0",t:"diminutivos",k:"mc",q:"O diminutivo de casa é:",g:"la casa / la casita",c:["casinha","casazinha","casinho","casita"],a:"casinha",h:"¿Qué le pasa a la vocal final antes de que entre el sufijo?",e:"Casa da casinha: se come la a final y entra -inha.",w:[]},
{id:"dim-1",t:"diminutivos",k:"mc",q:"O diminutivo de café é:",g:"el café / el cafecito",c:["cafezinho","cafeinho","cafézinho","cafinho"],a:"cafezinho",h:"¿Dónde cae el acento en café, y qué sufijo piden las palabras así?",e:"Café termina en sílaba tónica, así que pide -zinho: cafezinho.",w:[]},
{id:"dim-2",t:"diminutivos",k:"mc",q:"O diminutivo de saco é:",g:"la bolsa / la bolsita",c:["saquinho","sacinho","saquinha","saconho"],a:"saquinho",h:"Si escribieras sacinho, ¿seguiría sonando igual la c?",e:"Saco da saquinho: la c pasa a qu para conservar el sonido. Frasco da frasquinho.",w:[]},
{id:"dim-3",t:"diminutivos",k:"mc",q:"O diminutivo de cidade é:",g:"la ciudad / la ciudadita",c:["cidadezinha","cidadinha","cidadezinho","cidadinho"],a:"cidadezinha",h:"Termina en -dade. ¿Ese final pide la z o no?",e:"Las palabras en -dade hacen -zinha: cidadezinha, saudadezinha, verdadezinha.",w:[]},
{id:"dim-4",t:"diminutivos",k:"mc",q:"O diminutivo de mão é:",g:"la mano / la manita",c:["mãozinha","mãinha","mãozinho","manzinha"],a:"mãozinha",h:"El final es nasal. ¿Qué sufijo piden los sonidos nasales?",e:"Mão da mãozinha. Igual irmão da irmãozinho y avião da aviãozinho.",w:[]},
{id:"dim-5",t:"diminutivos",k:"mc",q:"O diminutivo de pai é:",g:"el papá / el papito",c:["paizinho","painho","paiinho","pazinho"],a:"paizinho",h:"Pai termina en dos vocales juntas. ¿Y entonces qué sufijo le toca?",e:"Dos vocales al final piden -zinho: paizinho, boazinha, relogiozinho.",w:[]},
{id:"dim-6",t:"diminutivos",k:"mc",q:"O diminutivo de nariz é:",g:"la nariz / la naricita",c:["narizinho","narizzinho","narinho","narizinha"],a:"narizinho",h:"Las palabras en -s y en -z, ¿piden la z del sufijo o no?",e:"En -z entra -inho sin más: narizinho, arrozinho, cruzinha.",w:[]},
{id:"dim-7",t:"diminutivos",k:"mc",q:"O diminutivo de papel é:",g:"el papel / el papelito",c:["papelzinho","papelinho","papezinho","papelinha"],a:"papelzinho",h:"¿Dónde cae el acento en papel?",e:"Papel termina en sílaba tónica: papelzinho. Igual anel da anelzinho.",w:[]},
{id:"dim-8",t:"diminutivos",k:"mc",q:"Você aceita um ___?",g:"¿Acepta un cafecito?",c:["cafezinho","café pequeno","cafeziho","cafedinho"],a:"cafezinho",h:"¿Se está ofreciendo un café chico, o es simplemente así como se ofrece un café?",e:"Um cafezinho es un café normal, servido corto. El diminutivo aquí no mide nada.",w:["dim-uso"]},
{id:"dim-9",t:"diminutivos",k:"mc",q:"O que mãezinha acrescenta a mãe?",g:"",c:["carinho","tamanho","desprezo","pressa"],a:"carinho",h:"Si alguien llama así a su madre, ¿está hablando de su estatura?",e:"El diminutivo carga cariño, no tamaño: mãezinha, filhinho, amorzinho.",w:["dim-uso"]},
{id:"dim-10",t:"diminutivos",k:"mc",q:"Deixa eu dar uma ___.",g:"Déjame echar un ojito.",c:["olhadinha","olhada pequena","olhadazinha","olhinha"],a:"olhadinha",h:"¿Para qué sirve el diminutivo en un pedido: para medirlo o para suavizarlo?",e:"Uma olhadinha suaviza el pedido. Igual um minutinho y um pouquinho.",w:["dim-uso"]},
{id:"dim-11",t:"diminutivos",k:"w",q:"Escríbelo en portugués: “un vasito de agua”",g:"",a:"um copinho de água",alt:["um copinho d'água","copinho de água","copinho d'água"],h:"Copo termina en vocal átona. ¿Lleva z el sufijo?",e:"Um copinho de água: se come la o final y entra -inho.",w:[]},
{id:"ind-0",t:"indefinidos",k:"mc",q:"Você sabe de ___ lugar para comprar bons livros?",g:"¿Sabes de algún lugar para comprar buenos libros?",c:["algum","alguma","alguns","algumas"],a:"algum",h:"Lugar es masculino singular. ¿Qué forma le toca al indefinido?",e:"Algum lugar. Los indefinidos variables concuerdan como un adjetivo.",w:[]},
{id:"ind-1",t:"indefinidos",k:"mc",q:"Ele conhece ___ que já visitou mais de dez países.",g:"Él conoce a alguien que ya visitó más de diez países.",c:["alguém","algum","alguma","ninguém"],a:"alguém",h:"¿Se está nombrando una cosa o una persona sin decir quién?",e:"Alguém apunta a una persona indeterminada, y no cambia nunca de forma.",w:[]},
{id:"ind-2",t:"indefinidos",k:"mc",q:"Eu fui até sua casa, mas ___ estava lá.",g:"Fui hasta tu casa, pero no había nadie.",c:["ninguém","nenhum","nada","alguém"],a:"ninguém",h:"Lo que falta es una persona, no una cosa. ¿Cuál de las invariables es esa?",e:"Ninguém es el contrario de alguém, y es invariable.",w:[]},
{id:"ind-3",t:"indefinidos",k:"mc",q:"Eu não tenho ___, estou lisa.",g:"No tengo nada, estoy sin plata.",c:["nada","ninguém","nenhum","nenhuma"],a:"nada",h:"Lo que falta son cosas, no personas. ¿Cuál es el contrario de tudo?",e:"Nada es el contrario de tudo, y tampoco cambia de forma.",w:["tudo-todo"]},
{id:"ind-4",t:"indefinidos",k:"mc",q:"Não tenho ___ problema com ela.",g:"No tengo ningún problema con ella.",c:["nenhum","nenhuma","nenhuns","nenhumas"],a:"nenhum",h:"Problema termina en -a, pero ¿de qué género es en portugués?",e:"O problema es masculino, así que nenhum problema. El final en -a engaña.",w:[]},
{id:"ind-5",t:"indefinidos",k:"mc",q:"Comprei um presente para ___ criança.",g:"Compré un regalo para cada niño.",c:["cada","cadas","toda","todas"],a:"cada",h:"¿Tiene plural esta palabra?",e:"Cada es invariable y no se pluraliza: cada criança, cada um, cada uma.",w:[]},
{id:"ind-6",t:"indefinidos",k:"mc",q:"Nós bebemos ___ cervejas ontem.",g:"Tomamos muchas cervezas ayer.",c:["muitas","muito","muitos","muita"],a:"muitas",h:"Cervejas es femenino plural. ¿Y el indefinido que lo acompaña?",e:"Muitas cervejas. Muito concuerda siempre que acompañe a un sustantivo.",w:[]},
{id:"ind-7",t:"indefinidos",k:"mc",q:"___ problemas que surjam, contem comigo.",g:"Cualesquiera problemas que surjan, cuenten conmigo.",c:["Quaisquer","Qualquers","Qualquer","Quaisqueres"],a:"Quaisquer",h:"El plural de esta palabra no se forma al final. ¿Dónde se forma?",e:"Qualquer da quaisquer: el plural entra por dentro de la palabra.",w:[]},
{id:"ind-8",t:"indefinidos",k:"mc",q:"Ela comprou ___ na loja.",g:"Ella compró todo en la tienda.",c:["tudo","todo","todos","todas"],a:"tudo",h:"¿Hay algún sustantivo detrás del espacio en el que la palabra se pueda apoyar?",e:"No hay sustantivo detrás, así que va tudo, que se sostiene solo.",w:["tudo-todo"]},
{id:"ind-9",t:"indefinidos",k:"mc",q:"___ os dias eu trabalho.",g:"Todos los días trabajo.",c:["Todos","Tudo","Toda","Todo"],a:"Todos",h:"Dias está ahí mismo y es masculino plural. ¿Concuerda la palabra con él o no?",e:"Todos os dias. Con sustantivo detrás va todo, y concuerda con él.",w:["tudo-todo"]},
{id:"ind-10",t:"indefinidos",k:"mc",q:"Ele trabalha ___ dia e chega em casa à noite.",g:"Él trabaja todo el día y llega a casa de noche.",c:["todo o","tudo o","toda a","todos os"],a:"todo o",h:"¿Se habla de cada día, o del día completo?",e:"Todo o dia, con artículo, es el día entero. Todo dia, sin artículo, es cada día.",w:["tudo-todo"]},
{id:"ind-11",t:"indefinidos",k:"w",q:"Escríbelo en portugués: “Él vio todo lo que pasó.”",g:"",a:"ele viu tudo o que aconteceu",alt:["viu tudo o que aconteceu"],h:"Delante de o que, ¿va la forma invariable o la que concuerda?",e:"Ele viu tudo o que aconteceu.",w:["tudo-todo"]},
{id:"hor-0",t:"horas",k:"mc",q:"___ uma hora.",g:"Es la una.",c:["É","São","Sou","Está"],a:"É",h:"¿Cuántas horas nombra la frase: una o varias?",e:"É uma hora. Solo la una lleva é; el resto lleva são.",w:[]},
{id:"hor-1",t:"horas",k:"mc",q:"___ duas horas.",g:"Son las dos.",c:["São","É","Estão","Sou"],a:"São",h:"¿Dos horas son una sola o varias?",e:"São duas horas. De las dos en adelante siempre va são.",w:[]},
{id:"hor-2",t:"horas",k:"mc",q:"Como se diz 2h15?",g:"Son las dos y cuarto.",c:["São duas e quinze","São duas e quarto","São duas e um quarto","É duas e quinze"],a:"São duas e quinze",h:"El español dice y cuarto. ¿Existe esa palabra en la hora portuguesa?",e:"São duas e quinze. Quarto no se usa nunca para la hora.",w:[]},
{id:"hor-3",t:"horas",k:"mc",q:"Como se diz 10h45?",g:"Son las once menos cuarto.",c:["São quinze para as onze","São onze menos quinze","São onze para as quinze","É quinze para as onze"],a:"São quinze para as onze",h:"Para restar minutos, ¿qué se dice primero, la hora o los minutos?",e:"Primero el minuto y después para as: quinze para as onze.",w:[]},
{id:"hor-4",t:"horas",k:"mc",q:"___ meio-dia.",g:"Es mediodía.",c:["É","São","Está","Sou"],a:"É",h:"Meio-dia nombra una sola hora. ¿Qué forma le toca?",e:"É meio-dia, igual que é uma hora.",w:[]},
{id:"hor-5",t:"horas",k:"mc",q:"Eu almoço ___ meio-dia.",g:"Almuerzo al mediodía.",c:["ao","à","a","às"],a:"ao",h:"¿Meio-dia es masculino o femenino?",e:"Meio-dia es masculino: a + o = ao meio-dia.",w:["contr"]},
{id:"hor-6",t:"horas",k:"mc",q:"Eu durmo ___ meia-noite.",g:"Duermo a medianoche.",c:["à","ao","a","às"],a:"à",h:"Meia-noite es femenina y singular. ¿Qué sale de a + a?",e:"a + a = à meia-noite.",w:["contr"]},
{id:"hor-7",t:"horas",k:"mc",q:"Eu vou ao cinema ___ sete da noite.",g:"Voy al cine a las siete de la noche.",c:["às","as","à","aos"],a:"às",h:"¿La frase responde a que horas? Si es así, hay preposición además del artículo.",e:"às sete: la preposición a más el artículo as.",w:["contr"]},
{id:"hor-8",t:"horas",k:"mc",q:"___ sete horas da manhã. Está na hora de acordar.",g:"Son las siete de la mañana.",c:["São","Às","É","As"],a:"São",h:"Aquí no se dice a qué hora pasa algo, solo qué hora es. ¿Hace falta la preposición?",e:"São sete horas, sin crase. Às sete horas respondería a qué hora.",w:[]},
{id:"hor-9",t:"horas",k:"mc",q:"Como se diz 11h50?",g:"Son las doce menos diez.",c:["São dez para a meia-noite","São dez para meia-noite","São dez para as meia-noite","É dez para a meia-noite"],a:"São dez para a meia-noite",h:"Meia-noite es femenina y singular. ¿Qué artículo le toca detrás de para?",e:"São dez para a meia-noite.",w:[]},
{id:"hor-10",t:"horas",k:"mc",q:"São seis horas ___.",g:"Son las seis en punto.",c:["em ponto","em punto","no ponto","de ponto"],a:"em ponto",h:"¿Con em o con no se dice en punto?",e:"Em ponto: são seis horas em ponto.",w:[]},
{id:"hor-11",t:"horas",k:"w",q:"Escríbelo en portugués: “Es la una y media.”",g:"",a:"é uma hora e meia",alt:["é uma e meia"],h:"¿Una hora lleva é o são? ¿Y media se dice meia o metade?",e:"É uma hora e meia.",w:[]},
{id:"fam-0",t:"familia",k:"mc",q:"O irmão da minha mãe é meu ___.",g:"El hermano de mi madre es mi tío.",c:["tio","sobrinho","primo","cunhado"],a:"tio",h:"¿Qué parentesco tienes tú con el hermano de tu madre?",e:"O irmão da mãe ou do pai é o tio.",w:[]},
{id:"fam-1",t:"familia",k:"mc",q:"O filho do meu irmão é meu ___.",g:"El hijo de mi hermano es mi sobrino.",c:["sobrinho","neto","primo","genro"],a:"sobrinho",h:"En español es sobrino. ¿Qué letras cambian al pasarlo?",e:"Sobrinho, con nh.",w:[]},
{id:"fam-2",t:"familia",k:"mc",q:"O pai do meu pai é meu ___.",g:"El padre de mi padre es mi abuelo.",c:["avô","avó","bisavô","sogro"],a:"avô",h:"Las dos primeras solo se diferencian por el acento. ¿Cuál es el masculino?",e:"Avô con ô es el abuelo; avó con ó es la abuela.",w:[]},
{id:"fam-3",t:"familia",k:"mc",q:"A mãe da minha mãe é minha ___.",g:"La madre de mi madre es mi abuela.",c:["avó","avô","sogra","madrasta"],a:"avó",h:"¿Qué acento lleva la forma femenina?",e:"Avó con ó. Es la única letra que la separa de avô.",w:[]},
{id:"fam-4",t:"familia",k:"mc",q:"O marido da minha filha é meu ___.",g:"El marido de mi hija es mi yerno.",c:["genro","sogro","cunhado","padrasto"],a:"genro",h:"Esta no se parece nada al español. ¿La recuerdas de la tabla?",e:"O genro es el yerno. Hay que aprenderla de memoria.",w:[]},
{id:"fam-5",t:"familia",k:"mc",q:"A esposa do meu filho é minha ___.",g:"La esposa de mi hijo es mi nuera.",c:["nora","sogra","cunhada","neta"],a:"nora",h:"Es la pareja de genro. ¿Cómo se llama?",e:"A nora es la nuera.",w:[]},
{id:"fam-6",t:"familia",k:"mc",q:"O irmão da minha esposa é meu ___.",g:"El hermano de mi esposa es mi cuñado.",c:["cunhado","genro","sogro","primo"],a:"cunhado",h:"En español es cuñado. ¿Cómo se escribe aquí ese sonido?",e:"Cunhado: la ñ del español se escribe nh.",w:[]},
{id:"fam-7",t:"familia",k:"mc",q:"A nova esposa do meu pai é minha ___.",g:"La nueva esposa de mi padre es mi madrastra.",c:["madrasta","madrinha","sogra","enteada"],a:"madrasta",h:"El español pone una r de más. ¿Dónde está?",e:"Madrasta, sin la r de madrastra. El masculino es padrasto.",w:[]},
{id:"fam-8",t:"familia",k:"mc",q:"Os meus ___ são o meu pai e a minha mãe.",g:"Mis padres son mi padre y mi madre.",c:["pais","países","padres","parentes"],a:"pais",h:"¿Cuál de las dos primeras lleva acento, y qué significa esa?",e:"Os pais son los padres. Os países, con acento, son los países.",w:[]},
{id:"fam-9",t:"familia",k:"mc",q:"O filho mais novo da família é o ___.",g:"El hijo menor de la familia.",c:["caçula","mais velho","do meio","afilhado"],a:"caçula",h:"¿Qué palabra brasileña nombra al menor de todos los hermanos?",e:"O caçula es el menor. También se dice o filho mais novo.",w:[]},
{id:"fam-10",t:"familia",k:"mc",q:"Quem me batizou é meu ___.",g:"Quien me bautizó es mi padrino.",c:["padrinho","padrasto","afilhado","sogro"],a:"padrinho",h:"Cuidado con el que se le parece: ¿cuál es el padrino y cuál el padrastro?",e:"O padrinho es el padrino; o padrasto es el padrastro.",w:[]},
{id:"fam-11",t:"familia",k:"w",q:"Escríbelo en portugués: “mi abuela y mi hermana”",g:"",a:"minha avó e minha irmã",alt:["a minha avó e a minha irmã"],h:"¿Qué acento lleva la abuela, y cómo termina hermana?",e:"Minha avó e minha irmã.",w:[]},
{id:"rou-0",t:"roupas",k:"mc",q:"Como se diz falda?",g:"la falda",c:["a saia","a calça","a blusa","a camisola"],a:"a saia",h:"¿Esta prenda es masculina o femenina en portugués?",e:"A saia es la falda.",w:[]},
{id:"rou-1",t:"roupas",k:"mc",q:"Como se diz pantalón?",g:"el pantalón",c:["a calça","o calção","a calcinha","o terno"],a:"a calça",h:"En español es masculino. ¿Y en portugués, qué género y qué número?",e:"A calça: femenina y en singular. A calcinha es la ropa interior.",w:[]},
{id:"rou-2",t:"roupas",k:"mc",q:"Como se diz calcetines?",g:"los calcetines",c:["as meias","as calças","os sapatos","as luvas"],a:"as meias",h:"La misma palabra sirve para el calcetín y para la media. ¿Cuál es?",e:"As meias valen para los dos, y casi siempre van en plural.",w:[]},
{id:"rou-3",t:"roupas",k:"mc",q:"O saco de homem chama-se:",g:"el saco de hombre",c:["o paletó","o saco","o colete","o casaco"],a:"o paletó",h:"Saco existe en portugués, pero nombra otra cosa. ¿Cuál es la prenda?",e:"O paletó en el hombre, o blaiser en la mujer.",w:[]},
{id:"rou-4",t:"roupas",k:"mc",q:"Como se diz abrigo?",g:"el abrigo",c:["o casaco","a jaqueta","o colete","o terno"],a:"o casaco",h:"¿Cuál es la prenda larga, la de más abrigo?",e:"O casaco es el abrigo; a jaqueta es la chaqueta.",w:[]},
{id:"rou-5",t:"roupas",k:"mc",q:"Como se diz chaleco?",g:"el chaleco",c:["o colete","o casaco","o paletó","o cinto"],a:"o colete",h:"La prenda sin mangas que va debajo del saco, ¿cómo se llama?",e:"O colete es el chaleco.",w:[]},
{id:"rou-6",t:"roupas",k:"mc",q:"Onde você guarda o dinheiro?",g:"¿Dónde guardas el dinero?",c:["na carteira","na bolsa","na mochila","no colete"],a:"na carteira",h:"En español cartera es el bolso. ¿Qué nombra en portugués?",e:"A carteira es la billetera. El bolso es a bolsa: están cambiadas.",w:[]},
{id:"rou-7",t:"roupas",k:"mc",q:"Como se diz cartera, a de carregar no ombro?",g:"la cartera, el bolso",c:["a bolsa","a carteira","a mochila","a sombrinha"],a:"a bolsa",h:"Si carteira es la billetera, ¿qué palabra queda para el bolso?",e:"A bolsa. Es el falso amigo que más se repite.",w:[]},
{id:"rou-8",t:"roupas",k:"mc",q:"Como se diz gorra?",g:"la gorra",c:["o boné","o chapéu","a boina","o capacete"],a:"o boné",h:"La que lleva visera, ¿cómo se llama?",e:"O boné es la gorra con visera. O chapéu es el sombrero de ala.",w:[]},
{id:"rou-9",t:"roupas",k:"mc",q:"Como se diz aretes?",g:"los aretes",c:["os brincos","os colares","as pulseiras","os anéis"],a:"os brincos",h:"¿Qué se pone en las orejas?",e:"Os brincos son los aretes. No tiene relación con brincar, que es jugar.",w:[]},

/* Ids are written into each item by hand and must never change: progress is
   filed under them. They used to be computed from the array position, so
   inserting one item silently re-pointed every later item's saved progress at
   a different sentence. test/ids.test.js is the hard gate; this is the shout
   if something slips past it. */
(function(){
  var seen = {}, bad = [];
  B.forEach(function(it, i){
    if(!it.id) bad.push("item " + i + " (" + it.t + ") has no id");
    else if(seen[it.id]) bad.push("duplicate id " + it.id);
    else seen[it.id] = 1;
  });
  if(bad.length && window.console) console.error("portu bank:", bad.join("; "));
})();

function others(set, ans, n){
  var pool = set.filter(function(x){ return x !== ans; });
  var out = [ans];
  while(out.length < n && pool.length) out.push(pool.splice((Math.random()*pool.length)|0,1)[0]);
  return out;
}
